name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [18, 22]
        # GitHub's macOS runners no longer start Node 18 jobs (it is past end of life); Ubuntu and Windows still test it.
        exclude:
          - os: macos-latest
            node: 18
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ matrix.node }}
      - run: npm run lint
      - run: npm test
      - run: npm run eval
      - name: Catalog is up to date
        if: matrix.os == 'ubuntu-latest' && matrix.node == 22
        run: |
          npm run catalog
          git diff --exit-code -- catalog.json README.md .claude-plugin/plugin.json || (echo "Run 'npm run catalog' and commit the result" && exit 1)
      - name: Shell installer works without Node CLI options
        if: matrix.os != 'windows-latest'
        run: |
          HOME="$(mktemp -d)" bash install.sh install --target agents --dry-run
