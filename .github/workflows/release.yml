name: Release

# Publishes @ketecode/loom to npm when a version tag (v1.2.3) is pushed, using npm trusted
# publishing: GitHub's OIDC token proves where the build came from, so no npm token is stored
# here, and npm attaches a provenance attestation. Setup: docs/RELEASING.md.

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          # No dependency cache in a job that can write or publish; v5 caches if package.json gains packageManager.
          package-manager-cache: false
      # Trusted publishing needs npm 11.5.1 or later; pinned so the publish job never runs an unreviewed npm.
      - run: npm install -g npm@11.21.1
      - run: npm ci
      - name: Tag matches package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi
      - run: npm run check
      - run: npm publish
