name: Release

# Publishes @ketecode/loom to npm when a version tag (v1.2.3) is pushed, using npm trusted
# publishing: GitHub's OIDC token proves where the build came from, so no npm token is stored
# here, and npm attaches a provenance attestation. Setup: docs/RELEASING.md.

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or later; pinned so the publish job never runs an unreviewed npm.
      - run: npm install -g npm@11.21.1
      - run: npm ci
      - name: Tag matches package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi
      - run: npm run check
      - run: npm publish
